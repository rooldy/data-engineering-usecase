services:
  # =========================
  # PostgreSQL (Airflow DB)
  # =========================
  postgres:
    image: postgres:15-alpine
    container_name: airflow_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  # =========================
  # Airflow - Initialisation
  # =========================
  airflow-init:
    image: apache/airflow:2.9.1-python3.10
    container_name: airflow_init
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    command:
      - bash
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password Admin1 \
          --firstname Rooldy \
          --lastname Alphonse \
          --role Admin \
          --email arooldy@gmail.com
    restart: "no"

  # =========================
  # Airflow Webserver
  # =========================
  airflow-webserver:
    image: apache/airflow:2.9.1-python3.10
    container_name: airflow_webserver
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ../dags:/opt/airflow/dags
      - ../logs:/opt/airflow/logs
      - ../plugins:/opt/airflow/plugins
    ports:
      - "8080:8080"
    command: webserver
    restart: always

  # =========================
  # Airflow Scheduler
  # =========================
  airflow-scheduler:
    image: apache/airflow:2.9.1-python3.10
    container_name: airflow_scheduler
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    volumes:
      - ../dags:/opt/airflow/dags
      - ../logs:/opt/airflow/logs
      - ../plugins:/opt/airflow/plugins
    command: scheduler
    restart: always

  # =========================
  # Airflow Triggerer
  # =========================
  airflow-triggerer:
    image: apache/airflow:2.9.1-python3.10
    container_name: airflow_triggerer
    depends_on:
      - postgres
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    volumes:
      - ../dags:/opt/airflow/dags
      - ../logs:/opt/airflow/logs
      - ../plugins:/opt/airflow/plugins
    command: triggerer
    restart: always

  # =========================
  # PySpark local (ARM compatible)
  # =========================
  pyspark:
    image: apache/spark:3.5.1
    container_name: pyspark_local
    environment:
      SPARK_MODE: master
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
    volumes:
      - ../src:/app/src
      - ../data:/app/data
    ports:
      - "4040:4040"
    command: tail -f /dev/null
    restart: on-failure

# =========================
# Volumes
# =========================
volumes:
  postgres_data:
